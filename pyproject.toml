[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketpilot"
version = "1.1.0"
description = "Evidence-grounded multi-agent product intelligence architecture foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "MarketPilot Engineers" }]
license = { text = "MIT" }
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.142.2",
  "openai>=1.40,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.1,<4",
]

[project.scripts]
marketpilot = "marketpilot.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/marketpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "C4",
  "SIM",
  "TCH",
  "RUF",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
